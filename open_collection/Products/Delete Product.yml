info:
  name: Delete Product
  type: http
  seq: 4

http:
  method: POST
  url: "{{host}}/api/products/:change/:id"
  params:
    - name: change
      value: delete
      type: path
    - name: id
      value: "{{productId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: pre-request
      code: |-
        const productId = bru.getEnvVar('productId');
        if (!productId) {
          console.warn('WARNING: productId is not set. Did you run "Create Product" first?');
        } else {
          console.log('Using productId:', productId);
        }
        console.warn('INFO: Product must be deactivated before deletion. Run "Deactivate Product" first.');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
